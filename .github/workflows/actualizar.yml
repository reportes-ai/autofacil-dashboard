name: Actualizar datos dashboard

on:
  schedule:
    # Cada 30 minutos de 12:00 a 23:00 UTC (09:00 a 20:00 Chile UTC-3)
    - cron: '0,30 12-23 * * 1-5'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Ejecutar actualizador
        env:
          GITHUB_TOKEN: ${{ secrets.DATOS_TOKEN }}
          GITHUB_REPO: reportes-ai/autofacil-dashboard
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: python actualizar_datos.py
