name: Actualizar datos dashboard

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 09:00 Chile
    - cron: '0 14 * * 1-5'  # 11:00 Chile
    - cron: '0 16 * * 1-5'  # 13:00 Chile
    - cron: '0 18 * * 1-5'  # 15:00 Chile
    - cron: '0 20 * * 1-5'  # 17:00 Chile
    - cron: '0 22 * * 1-5'  # 19:00 Chile
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Ejecutar actualizador
        env:
          GITHUB_TOKEN: ${{ secrets.DATOS_TOKEN }}
          GITHUB_REPO: reportes-ai/autofacil-dashboard
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: python actualizar_datos.py
